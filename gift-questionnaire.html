<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Gift Notes</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap');

  :root{
    --paper: #FBF3F0;
    --paper-card: #FFFFFF;
    --ink: #2B1B24;
    --ink-soft: #6E5A62;
    --line: #EAD9D3;
    --rose: #B4657A;
    --rose-deep: #8E4A5C;
    --gold: #C08B3E;
    --done: #7C8F6E;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
  }

  .page{
    max-width:700px;
    margin:0 auto;
    padding:56px 24px 120px;
  }

  header.hero{
    margin-bottom:36px;
  }

  .kicker{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:16px;
    color:var(--rose-deep);
    margin:0 0 6px;
  }

  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(32px,6vw,44px);
    line-height:1.1;
    margin:0 0 14px;
    letter-spacing:-0.01em;
  }

  .lede{
    font-size:15.5px;
    line-height:1.6;
    color:var(--ink-soft);
    max-width:52ch;
    margin:0;
  }

  .controls{
    position:sticky;
    top:0;
    z-index:5;
    background:var(--paper);
    padding:18px 0 16px;
    margin-top:24px;
    border-bottom:1px solid var(--line);
  }

  .search-row{
    display:flex;
    gap:10px;
    align-items:center;
  }

  #search{
    flex:1;
    font-family:'Inter',sans-serif;
    font-size:15px;
    padding:11px 16px;
    border-radius:9px;
    border:1px solid var(--line);
    background:var(--paper-card);
    color:var(--ink);
    outline:none;
  }
  #search::placeholder{ color:#B9A6AC; }
  #search:focus{ border-color:var(--rose); }

  .progress-wrap{
    margin-top:12px;
    display:flex;
    align-items:center;
    gap:12px;
  }

  .progress-track{
    flex:1;
    height:6px;
    border-radius:4px;
    background:var(--line);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--gold);
    width:0%;
    transition:width .3s ease;
  }
  .progress-label{
    font-size:12.5px;
    color:var(--ink-soft);
    white-space:nowrap;
    font-variant-numeric: tabular-nums;
  }

  .sections{
    margin-top:8px;
  }

  details.section{
    border-bottom:1px solid var(--line);
    padding:20px 0;
  }
  details.section[open] summary .chev{ transform:rotate(90deg); }

  summary.sec-head{
    list-style:none;
    cursor:pointer;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
  }
  summary.sec-head::-webkit-details-marker{ display:none; }

  .sec-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:19px;
    display:flex;
    align-items:center;
    gap:9px;
  }
  .chev{
    display:inline-block;
    color:var(--rose);
    transition:transform .18s ease;
    font-size:13px;
  }
  .sec-count{
    font-size:12.5px;
    color:var(--ink-soft);
    white-space:nowrap;
    font-variant-numeric: tabular-nums;
  }

  .items{
    margin-top:16px;
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .item{
    display:grid;
    grid-template-columns:22px 1fr;
    gap:10px 12px;
    padding:10px 6px;
    border-radius:8px;
  }
  .item:hover{ background:rgba(180,101,122,0.06); }

  .item input[type=checkbox]{
    appearance:none;
    width:19px;
    height:19px;
    margin-top:2px;
    border:1.5px solid #D9C3C9;
    border-radius:5px;
    cursor:pointer;
    position:relative;
    background:var(--paper-card);
    flex-shrink:0;
  }
  .item input[type=checkbox]:checked{
    background:var(--done);
    border-color:var(--done);
  }
  .item input[type=checkbox]:checked::after{
    content:'';
    position:absolute;
    left:6px; top:2px;
    width:5px; height:9px;
    border:solid white;
    border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }

  .item-body{ min-width:0; }

  .q-text{
    font-size:14.5px;
    line-height:1.5;
    margin:0 0 6px;
  }
  .item.answered .q-text{ color:var(--ink-soft); }

  .a-input{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:8px 10px;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--paper-card);
    color:var(--ink);
    outline:none;
  }
  .a-input::placeholder{ color:#C7B4BA; }
  .a-input:focus{ border-color:var(--rose); }

  .hidden{ display:none !important; }

  .empty-state{
    padding:40px 0;
    text-align:center;
    color:var(--ink-soft);
    font-size:14.5px;
  }

  footer.foot{
    margin-top:40px;
    padding-top:20px;
    border-top:1px solid var(--line);
    font-size:12.5px;
    color:var(--ink-soft);
    display:flex;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .foot button{
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    color:var(--rose-deep);
    background:none;
    border:none;
    cursor:pointer;
    padding:0;
    text-decoration:underline;
    text-underline-offset:2px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>

<body>
<div class="page">

  <header class="hero">
    <p class="kicker">for someone I love</p>
    <h1>Gift Notes</h1>
    <p class="lede">A running list of everything worth remembering — answered a little at a time, whenever it comes up in conversation.</p>
  </header>

  <div class="controls">
    <div class="search-row">
      <input id="search" type="text" placeholder="Search every question…" autocomplete="off" />
    </div>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">0 / 0 answered</div>
    </div>
  </div>

  <div class="sections" id="sections"></div>
  <div class="empty-state hidden" id="emptyState">Nothing matches that search.</div>

  <footer class="foot">
    <span>Answers save automatically to this page.</span>
    <button id="clearAll">Clear all answers</button>
  </footer>

</div>

const STORAGE_KEY = "gift-questionnaire-answers";
let answers = {};

function slug(sectionIdx, itemIdx){ return "s"+sectionIdx+"i"+itemIdx; }

async function loadAnswers(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){ answers = JSON.parse(res.value); }
  }catch(e){ /* no saved data yet */ }
}

let saveTimer = null;
function persist(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await window.storage.set(STORAGE_KEY, JSON.stringify(answers), false); }
    catch(e){ console.error("save failed", e); }
  }, 250);
}

function totalCount(){
  return DATA.reduce((sum,[,items])=>sum+items.length,0);
}
function answeredCount(){
  return Object.values(answers).filter(a=>a && (a.done || (a.note && a.note.trim()))).length;
}

function updateProgress(){
  const total = totalCount();
  const done = answeredCount();
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById("progressFill").style.width = pct+"%";
  document.getElementById("progressLabel").textContent = done+" / "+total+" answered";
}

function sectionAnsweredCount(items, sIdx){
  let c=0;
  items.forEach((_,iIdx)=>{
    const a = answers[slug(sIdx,iIdx)];
    if(a && (a.done || (a.note && a.note.trim()))) c++;
  });
  return c;
}

function render(){
  const container = document.getElementById("sections");
  container.innerHTML = "";
  DATA.forEach(([title, items], sIdx)=>{
    const details = document.createElement("details");
    details.className = "section";
    details.dataset.section = sIdx;

    const summary = document.createElement("summary");
    summary.className = "sec-head";
    summary.innerHTML =
      '<span class="sec-title"><span class="chev">›</span>'+title+'</span>'+
      '<span class="sec-count" data-role="sec-count">'+sectionAnsweredCount(items,sIdx)+' / '+items.length+'</span>';
    details.appendChild(summary);

    const list = document.createElement("div");
    list.className = "items";

    items.forEach((text, iIdx)=>{
      const id = slug(sIdx, iIdx);
      const saved = answers[id] || {done:false, note:""};

      const row = document.createElement("div");
      row.className = "item" + (saved.done || saved.note.trim() ? " answered" : "");
      row.dataset.text = text.toLowerCase();

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = !!saved.done;
      cb.addEventListener("change", ()=>{
        answers[id] = answers[id] || {done:false, note:""};
        answers[id].done = cb.checked;
        row.classList.toggle("answered", cb.checked || answers[id].note.trim().length>0);
        persist();
        updateProgress();
        refreshSectionCount(sIdx);
      });

      const body = document.createElement("div");
      body.className = "item-body";

      const q = document.createElement("p");
      q.className = "q-text";
      q.textContent = text;

      const input = document.createElement("input");
      input.type = "text";
      input.className = "a-input";
      input.placeholder = "notes / answer…";
      input.value = saved.note || "";
      input.addEventListener("input", ()=>{
        answers[id] = answers[id] || {done:false, note:""};
        answers[id].note = input.value;
        row.classList.toggle("answered", cb.checked || input.value.trim().length>0);
        persist();
        updateProgress();
        refreshSectionCount(sIdx);
      });

      body.appendChild(q);
      body.appendChild(input);
      row.appendChild(cb);
      row.appendChild(body);
      list.appendChild(row);
    });

    details.appendChild(list);
    container.appendChild(details);
  });
  updateProgress();
}

function refreshSectionCount(sIdx){
  const details = document.querySelector('details.section[data-section="'+sIdx+'"]');
  if(!details) return;
  const items = DATA[sIdx][1];
  const countEl = details.querySelector('[data-role="sec-count"]');
  if(countEl) countEl.textContent = sectionAnsweredCount(items,sIdx)+' / '+items.length;
}

function applySearch(term){
  term = term.trim().toLowerCase();
  const sections = document.querySelectorAll('details.section');
  let anyVisible = false;
  sections.forEach(sec=>{
    const rows = sec.querySelectorAll('.item');
    let sectionHasMatch = false;
    rows.forEach(row=>{
      const match = !term || row.dataset.text.includes(term);
      row.classList.toggle('hidden', !match);
      if(match) sectionHasMatch = true;
    });
    sec.classList.toggle('hidden', !sectionHasMatch);
    if(sectionHasMatch){
      anyVisible = true;
      if(term) sec.open = true;
    }
  });
  document.getElementById('emptyState').classList.toggle('hidden', anyVisible || !term);
}

document.getElementById('search').addEventListener('input', e=>applySearch(e.target.value));

document.getElementById('clearAll').addEventListener('click', async ()=>{
  if(!confirm("Clear every checkbox and note? This can't be undone.")) return;
  answers = {};
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify(answers), false); }catch(e){}
  render();
});

(async function init(){
  await loadAnswers();
  render();
})();
</script>
</body>
</html>
